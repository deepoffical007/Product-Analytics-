<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>GyaanSetu</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: product UI from the GyaanSetu mockup, white throughout: white header, hero and cards with a royal-blue accent, left app-sidebar for Assistant/Dashboard/Community, bottom tab bar on phones. */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --sunk: #f5f7fc;
  --ink: #0f1733;
  --muted: #5b6584;
  --line: #e5e8f2;
  --navy: #ffffff;
  --navy-2: #eef1ff;
  --on-navy: #0f1733;
  --on-navy-muted: #5b6584;
  --accent: #3346e0;
  --accent-ink: #ffffff;
  --accent-soft: #eef1ff;
  --good: #12925f;
  --warn: #c97a08;
  --bad: #cc3d3d;
  --star: #f2a01b;
  --t-video: #3456e0;
  --t-pdf: #cc3d3d;
  --t-article: #12925f;
  --t-tutorial: #c97a08;
  --t-image: #7d4fe0;
  --shadow: 0 1px 2px rgba(15,23,51,.04), 0 12px 32px rgba(15,23,51,.07);
  --f-display: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif;
  --f-body: "Nunito Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.5; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--navy); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, h4 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
a { color: var(--accent); }
.wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* Buttons and chips */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 16px; border-radius: 9px; font-weight: 700; font-size: 14px; text-decoration: none; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.07); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--accent); padding-inline: 8px; }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.btn.like[aria-pressed="true"] { background: color-mix(in srgb, var(--bad) 14%, var(--surface)); border-color: var(--bad); color: var(--bad); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 800; letter-spacing: .03em; padding: 2px 9px; border-radius: 6px; color: var(--c); background: color-mix(in srgb, var(--c) 13%, transparent); }
.tag.video { --c: var(--t-video); } .tag.pdf { --c: var(--t-pdf); } .tag.article { --c: var(--t-article); } .tag.tutorial { --c: var(--t-tutorial); } .tag.image { --c: var(--t-image); }
.pill { display: inline-flex; font-size: 11.5px; font-weight: 700; padding: 1px 9px; border-radius: 999px; border: 1px solid currentColor; }
.pill.pos { color: var(--good); } .pill.neg { color: var(--bad); } .pill.neu { color: var(--muted); }
.stars { color: var(--star); letter-spacing: 1px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.card.pad { padding: 20px; }
input.field, textarea.field, select.field { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 10px 12px; outline: none; }
input.field:focus, textarea.field:focus, select.field:focus { border-color: var(--accent); }
textarea.field { resize: vertical; min-height: 80px; }
mark { background: color-mix(in srgb, var(--star) 35%, transparent); color: inherit; border-radius: 2px; padding: 0 1px; }

/* Header */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: rgba(255,255,255,.94); backdrop-filter: blur(10px); color: var(--on-navy); border-bottom: 1px solid var(--line); }
.navin { display: flex; align-items: center; gap: 18px; padding-block: 10px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 9px; background: none; border: 0; padding: 0; color: var(--on-navy); flex: none; }
.brand b { font-family: var(--f-display); font-size: 20px; font-weight: 800; letter-spacing: -.01em; }
.brand b span { color: var(--accent); }
.brand > svg { background: var(--accent); color: #fff; border-radius: 9px; padding: 4px; }
.brand svg { width: 30px; height: 30px; }
.hsearch { flex: 1; max-width: 520px; display: flex; align-items: center; background: var(--sunk); border: 1px solid var(--line); border-radius: 9px; overflow: hidden; min-width: 0; }
.hsearch input { flex: 1; min-width: 0; border: 0; background: transparent; padding: 9px 12px; outline: none; color: var(--ink); }
.hsearch button { border: 0; background: var(--accent); color: var(--accent-ink); width: 42px; align-self: stretch; display: grid; place-items: center; }
.links { display: flex; gap: 4px; margin-left: auto; }
.links button { background: none; border: 0; color: var(--on-navy-muted); font-weight: 700; font-size: 14px; padding: 8px 10px; border-radius: 8px; }
.links button:hover { color: var(--ink); background: var(--sunk); }
.links button.on { color: var(--accent); background: var(--accent-soft); }
.userchip { display: flex; align-items: center; gap: 8px; background: none; border: 0; color: var(--on-navy); font-weight: 700; font-size: 14px; flex: none; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; background: var(--accent); color: var(--accent-ink); flex: none; }
.authbtn { background: var(--accent); color: var(--accent-ink); border: 0; font-weight: 800; font-size: 13px; padding: 8px 14px; border-radius: 8px; flex: none; }
@media (max-width: 980px) { .links { display: none; } .hsearch { max-width: none; } }
@media (max-width: 760px) { .userchip span:not(.avatar), .authbtn { display: none; } .nav.onhome .hsearch { display: none; } .nav.onhome .navin { justify-content: space-between; } }

/* Bottom tab bar on phones */
.tabbar { display: none; }
@media (max-width: 760px) {
  body { padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--surface); border-top: 1px solid var(--line); padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
  .tabbar button { background: none; border: 0; display: grid; justify-items: center; gap: 2px; font-size: 11px; font-weight: 700; color: var(--muted); padding: 4px 0; }
  .tabbar button.on { color: var(--accent); }
  .tabbar svg.i { width: 22px; height: 22px; }
}

/* Home */
.hero { background: radial-gradient(60% 80% at 85% 20%, #eef1ff 0%, rgba(238,241,255,0) 70%), #fff; color: var(--on-navy); border-bottom: 1px solid var(--line); }
.heroin { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, .75fr); gap: 24px; align-items: center; padding-block: 44px 40px; }
.hero h1 { font-size: clamp(30px, 4.4vw, 48px); font-weight: 800; line-height: 1.1; max-width: 16ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero .tagline { color: var(--on-navy-muted); font-weight: 700; margin-top: 12px; letter-spacing: .02em; }
.bigsearch { margin-top: 26px; display: flex; background: var(--surface); border: 1px solid #d4d9e8; border-radius: 12px; padding: 6px; gap: 6px; max-width: 640px; box-shadow: var(--shadow); }
.bigsearch input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; padding: 10px 12px; font-size: 16px; color: var(--ink); }
.bigsearch button { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 9px; padding: 0 18px; display: flex; align-items: center; gap: 8px; font-weight: 800; }
.quicktypes { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
.quicktypes button { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 9px; padding: 9px 14px; font-weight: 700; font-size: 14px; }
.quicktypes button svg { color: var(--c); }
.heroart { justify-self: end; width: 100%; max-width: 360px; }
.heroart svg { width: 100%; height: auto; display: block; }
@media (max-width: 760px) { .heroin { grid-template-columns: 1fr; padding-block: 28px; } .heroart { display: none; } .bigsearch button span { display: none; } }
.homegrid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 20px; padding-block: 24px; }
@media (max-width: 900px) { .homegrid { grid-template-columns: 1fr; } }
.sectionhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
.sectionhead h2 { font-size: 19px; font-weight: 800; }
.subjects { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; }
.subj { display: grid; justify-items: center; gap: 8px; text-align: center; background: none; border: 1px solid transparent; border-radius: 12px; padding: 12px 6px; font-size: 13px; font-weight: 700; }
.subj:hover { border-color: var(--line); background: var(--sunk); }
.subj .ic { width: 50px; height: 50px; border-radius: 13px; display: grid; place-items: center; color: var(--c); background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.subj .ic svg { width: 26px; height: 26px; }
.subj small { color: var(--muted); font-weight: 600; font-size: 11.5px; }
ol.trend { list-style: none; margin: 0; padding: 0; display: grid; }
ol.trend li button { width: 100%; display: flex; align-items: center; gap: 12px; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 10px 2px; text-align: left; font-weight: 600; }
ol.trend li:last-child button { border-bottom: 0; }
ol.trend li button:hover { color: var(--accent); }
ol.trend .n { font-family: var(--f-mono); font-size: 12px; color: var(--muted); width: 22px; }
ol.trend .ct { margin-left: auto; font-size: 12px; color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.tile { display: grid; grid-template-rows: auto 1fr; overflow: hidden; text-align: left; padding: 0; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; }
.tile:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); box-shadow: var(--shadow); }
.tile .th { aspect-ratio: 16 / 9; max-width: 100%; }
.tile .th svg { width: 100%; height: 100%; display: block; }
.tile .tb { padding: 12px 14px 14px; display: grid; gap: 6px; align-content: start; }
.tile .tt { font-family: var(--f-display); font-weight: 700; font-size: 15px; line-height: 1.3; }
.tile .meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.features { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 14px; }
.feature { display: flex; gap: 14px; align-items: start; text-align: left; padding: 16px; border: 1px solid var(--line); background: var(--surface); border-radius: 14px; }
.feature:hover { border-color: var(--accent); }
.feature .ic { width: 42px; height: 42px; border-radius: 11px; display: grid; place-items: center; color: #fff; background: var(--c); flex: none; }
.feature b { font-family: var(--f-display); display: block; margin-bottom: 2px; }
.feature span { font-size: 13px; color: var(--muted); }
.foot { padding-block: 28px 40px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line); margin-top: 28px; }
.foot b { color: var(--ink); font-family: var(--f-display); }

/* Results */
.resgrid { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 24px; padding-block: 24px 48px; align-items: start; }
@media (max-width: 900px) { .resgrid { grid-template-columns: minmax(0, 1fr); gap: 14px; } }
.filters { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); max-height: calc(100vh - 92px); overflow: auto; }
@media (max-width: 900px) { .filters { position: static; max-height: none; } }
.filters > summary { list-style: none; padding: 14px 18px; font-family: var(--f-display); font-weight: 800; display: flex; justify-content: space-between; cursor: pointer; }
.filters > summary::-webkit-details-marker { display: none; }
.filters > summary::after { content: "+"; color: var(--muted); }
.filters[open] > summary::after { content: "–"; }
.fbody { padding: 0 18px 18px; display: grid; gap: 18px; }
.fgroup { display: grid; gap: 6px; }
.fgroup > .lbl { font-size: 12px; font-weight: 800; color: var(--ink); }
.opt { display: flex; align-items: center; gap: 10px; font-size: 14px; padding: 4px 0; cursor: pointer; }
.opt input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.opt .ct { margin-left: auto; font-size: 12px; color: var(--muted); font-family: var(--f-mono); }
.weights { display: grid; gap: 10px; }
.weight { display: grid; grid-template-columns: 10px 1fr auto; gap: 2px 8px; align-items: center; font-size: 13px; }
.weight .sw { width: 10px; height: 10px; border-radius: 3px; }
.weight output { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.weight input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.formula { font-family: var(--f-mono); font-size: 11.5px; color: var(--muted); background: var(--sunk); border-radius: 8px; padding: 10px; line-height: 1.6; }
.reshead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 12px; margin-bottom: 14px; }
.reshead h1 { font-size: 22px; font-weight: 800; }
.reshead .acts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.reshead select { width: auto; padding: 8px 10px; }
.expandnote { font-size: 13px; color: var(--muted); margin: -4px 0 12px; }
.expandnote b { color: var(--ink); }
ol.results { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
.result { display: grid; grid-template-columns: 168px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.result:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.result .th { display: block; padding: 0; border: 0; border-radius: 10px; overflow: hidden; aspect-ratio: 16 / 10; max-width: 100%; background: var(--sunk); }
.result .th svg { width: 100%; height: 100%; display: block; }
.result .rb { min-width: 0; display: grid; gap: 5px; }
.result .rt { font-family: var(--f-display); font-weight: 700; font-size: 16.5px; line-height: 1.3; }
.result .rt button { all: unset; cursor: pointer; }
.result .rt button:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.result .rt button:focus-visible { outline: 2px solid var(--accent); border-radius: 3px; }
.result .src { font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.result .desc { font-size: 13.5px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.result .st { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--muted); align-items: center; }
.result .st .mono { color: var(--ink); font-size: 12.5px; }
.result .side { display: grid; justify-items: end; gap: 8px; text-align: right; min-width: 96px; }
.qchip { display: grid; justify-items: end; }
.qchip b { font-family: var(--f-mono); font-size: 22px; line-height: 1; }
.qchip b small { font-size: 11px; color: var(--muted); font-weight: 500; }
.qchip span { font-size: 11.5px; font-weight: 800; }
.sbar { display: flex; width: 96px; height: 5px; border-radius: 3px; overflow: hidden; background: var(--sunk); }
.sbar i { display: block; height: 100%; }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 34px; height: 34px; display: grid; place-items: center; color: var(--muted); }
.iconbtn:hover { color: var(--accent); border-color: var(--accent); }
.iconbtn[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
.iconbtn[aria-pressed="true"] svg { fill: currentColor; }
.rank { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
@media (max-width: 680px) {
  .result { grid-template-columns: 104px minmax(0, 1fr); gap: 12px; align-items: start; }
  .result .side { grid-column: 1 / -1; grid-template-columns: auto auto 1fr auto; justify-items: start; align-items: center; text-align: left; }
  .result .side .iconbtn { justify-self: end; }
  .qchip { justify-items: start; }
  .result .desc { display: none; }
}
.aipath { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: linear-gradient(180deg, var(--accent-soft), var(--surface)); border-radius: 14px; padding: 16px 18px; margin-bottom: 14px; display: grid; gap: 10px; }
.aipath h3 { font-size: 15px; display: flex; gap: 8px; align-items: center; }
.aipath ol { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
.aipath li button { all: unset; cursor: pointer; font-weight: 800; color: var(--accent); }
.aipath li button:hover { text-decoration: underline; }
.aipath li p { font-size: 13.5px; color: var(--muted); }
.empty { padding: 28px; display: grid; gap: 10px; justify-items: start; }

/* Detail */
.back { margin-block: 18px 12px; }
.dtop { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr); gap: 24px; padding: 20px; }
@media (max-width: 860px) { .dtop { grid-template-columns: 1fr; } }
.dmedia { border-radius: 12px; overflow: hidden; aspect-ratio: 16 / 9; max-width: 100%; background: var(--sunk); position: relative; }
.dmedia svg { width: 100%; height: 100%; display: block; }
.dinfo { display: grid; gap: 10px; align-content: start; }
.dinfo h1 { font-size: clamp(22px, 2.6vw, 28px); font-weight: 800; line-height: 1.2; }
.dinfo .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13.5px; color: var(--muted); align-items: center; }
.dacts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.dgrid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 18px; margin-top: 18px; }
@media (max-width: 860px) { .dgrid { grid-template-columns: 1fr; } }
.kv { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; }
.card h2 { font-size: 16px; font-weight: 800; margin-bottom: 12px; }
.gaugewrap { display: grid; justify-items: center; gap: 4px; }
.gauge { width: 140px; height: 140px; }
.gauge text { font-family: var(--f-display); }
.checks { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 7px; font-size: 14px; }
.checks li { display: flex; gap: 9px; align-items: center; }
.checks li.ok svg { color: var(--good); }
.checks li.no { color: var(--muted); }
.breakdown { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
.breakdown td, .breakdown th { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: left; }
.breakdown th { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.breakdown .num { text-align: right; font-family: var(--f-mono); white-space: nowrap; }
.tablewrap { overflow-x: auto; }
.reviewtop { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; }
@media (max-width: 560px) { .reviewtop { grid-template-columns: 1fr; } }
.bigrate b { font-family: var(--f-display); font-size: 40px; font-weight: 800; line-height: 1; }
.dist { display: grid; gap: 4px; font-size: 12px; }
.dist div { display: grid; grid-template-columns: 26px 1fr 40px; gap: 8px; align-items: center; }
.dist .bar { height: 7px; background: var(--sunk); border-radius: 4px; overflow: hidden; }
.dist .bar i { display: block; height: 100%; background: var(--star); }

/* Tiny safe markdown: ## headings, - / 1. lists, **bold**, `code` */
function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`([^`]+)`/g, '<code>$1</code>');
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of text.split('\n')) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { close(); continue; }
    if ((m = line.match(/^#{1,4}\s+(.*)/))) { close(); out.push(`<h4>${inline(m[1])}</h4>`); }
    else if ((m = line.match(/^\s*[-*•]\s+(.*)/))) { if (list !== 'ul') { close(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${inline(m[1])}</li>`); }
    else if ((m = line.match(/^\s*\d+[.)]\s+(.*)/))) { if (list !== 'ol') { close(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${inline(m[1])}</li>`); }
    else { close(); out.push(`<p>${inline(line)}</p>`); }
  }
  close();

/* Offline helpers: extractive summary, cloze quiz, sentence retrieval */
function sentences(text) { return (text.replace(/\s+/g, ' ').match(/[^.!?]+[.!?]+|[^.!?]+$/g) || []).map(s => s.trim()).filter(s => s.split(' ').length >= 5); }
function keywords(text, n = 10) {
  const tf = {};
  text.toLowerCase().replace(/[^a-z0-9 ]+/g, ' ').split(' ').filter(w => w.length > 3 && !STOP.has(w)).forEach(w => tf[w] = (tf[w] || 0) + 1);
  return Object.entries(tf).sort((a, b) => b[1] - a[1]).slice(0, n).map(e => e[0]);
}
function extractive(text, n) {
  const ss = sentences(text); const kw = keywords(text, 25); const kws = new Set(kw);
  const scored = ss.map((s, i) => ({ s, i, v: s.toLowerCase().split(/[^a-z0-9]+/).filter(w => kws.has(w)).length / Math.sqrt(s.split(' ').length) + (i === 0 ? .3 : 0) }));
  return scored.sort((a, b) => b.v - a.v).slice(0, n).sort((a, b) => a.i - b.i).map(x => x.s);
}

async function buildPath() {
  const res = rank(ST.query); const cands = res.rows.slice(0, 10);
  ST.aiPath = { loading: true, q: ST.query }; $('aiPathBox').innerHTML = aiPathHTML();
  const offline = (err) => {
    const order = { Beginner: 0, Intermediate: 1, Advanced: 2 };
    const steps = cands.slice(0, 5).sort((a, b) => order[a.it.level] - order[b.it.level] || b.score - a.score).slice(0, 4)
      .map(r => ({ id: r.it.id, why: `${r.it.level} ${TYPE[r.it.type].label.toLowerCase()} with a quality score of ${Math.round(r.score * 100)}.` }));
    return { q: ST.query, offline: true, intro: 'Ordered from beginner to advanced, best-scored first.', steps, err };
  };
  const f = await aiReady;
  if (!AI.fn) { ST.aiPath = offline(f ? '' : AI.note); $('aiPathBox').innerHTML = aiPathHTML(); return; }
  const list = cands.map(r => ({ id: r.it.id, title: r.it.title, type: r.it.type, level: r.it.level, source: r.it.source, quality: Math.round(r.score * 100), about: r.it.desc }));
  try {
    const out = await AI.fn.json(`You are GyaanSetu's study guide. A learner searched for "${ST.query}". From the candidate resources below, choose 3 to 5 and order them into a learning path, from where to start to where to finish. Prefer high quality scores, mix content types where it helps, and move from beginner to advanced.
Reply with only JSON in this shape: {"intro": "one sentence on how to use the path", "steps": [{"id": "resource id from the list", "why": "one sentence on why this step comes here"}]}

Candidates:
${JSON.stringify(list)}`, { modelTier: 'quick' });
    const steps = (out && Array.isArray(out.steps) ? out.steps : []).filter(s => s && byId[String(s.id)] && cands.some(c => c.it.id === String(s.id))).map(s => ({ id: String(s.id), why: String(s.why || '') }));
    ST.aiPath = steps.length ? { q: ST.query, intro: String(out.intro || ''), steps } : offline('The AI answer did not match the results, so an offline ordering is shown.');
  } catch (e) { const r = aiErr(e); ST.aiPath = offline(r.msg); }
  if (ST.view === 'results') $('aiPathBox').innerHTML = aiPathHTML();
}

  const avg = L.rSum / L.rCount, score = Math.round(r.score * 100); const [ql, qc] = qualityLabel(r.score);
  const checks = [
    [q ? relNorm >= 0.5 : true, q ? 'Relevant to your search' : `Matches ${SUBJ[it.subject].name}`],
    [sig.eng >= 0.45, 'High user engagement'], [sig._pos >= 0.6, 'Positive feedback'],

Reply with only a JSON array: [{"q": "question", "options": ["A", "B", "C", "D"], "answer": 0, "why": "one-sentence explanation"}] where answer is the 0-based index of the correct option.

${mat}`, opts);
      const clean = (Array.isArray(items) ? items : []).filter(x => x && x.q && Array.isArray(x.options) && x.options.length >= 2).slice(0, 8)
        .map(x => ({ q: String(x.q), options: x.options.slice(0, 4).map(String), answer: Math.max(0, Math.min(3, Number(x.answer) || 0)), why: String(x.why || ''), picked: null }));
      if (!clean.length) throw { code: 'invalid_json' };
      award(2); save(); return done({ items: clean });
    }
    const prompt = t === 'summary'
      ? `You are GyaanSetu's study assistant. Summarise the study material for a student revising it.
Format in plain markdown: a 2-3 sentence overview paragraph, then "## Key Concepts" with 4-6 bullet points (bold the term at the start of each), then "## Remember" with one line to memorise. No preamble.

${mat}`
      : `You are GyaanSetu's study assistant. Extract the most important key points from the study material.
Format in plain markdown: "## Key Points" with 6-8 bullets, each "**Term**: short explanation", then "## Likely exam questions" with 3 bullets, then "## Common mistakes" with 2 bullets. No preamble.

${mat}`;
    const { text, truncated } = await AI.fn(prompt, { ...opts, onText: ({ text }) => { const el = $('liveOut'); if (el) el.innerHTML = md(text); ASSIST.out[t].text = text; } });
    award(1); save();
    done({ text, err: truncated ? 'The answer was cut short. Try a shorter section of the material.' : '' });
  } catch (e) {
    const r = aiErr(e);
    if (e && e.code === 'cancelled') return done(ASSIST.out[t].text ? { text: ASSIST.out[t].text, err: 'Stopped.' } : undefined);
    if (r.off || e.code === 'upstream_error' || e.code === 'rate_limited') return done(offlineTask(t, r.msg));
    done(e && e.text ? { text: e.text, err: r.msg } : { text: '', err: r.msg, failed: true });
  }
}
function offlineTask(t, note) {
  const text = ASSIST.text || '';
  if (!text) return { text: '', err: (note ? note + ' ' : '') + 'Image material needs the AI connection.' };
  const n = note ? note : '';
  if (t === 'summary') { const s = extractive(text, 4); return { offline: true, text: `${s.join(' ')}\n\n## Key terms\n${keywords(text, 6).map(k => `- **${k}**`).join('\n')}`, err: n }; }
  if (t === 'points') return { offline: true, text: `## Key Points\n${extractive(text, 7).map(s => '- ' + s).join('\n')}`, err: n };
  const kws = keywords(text, 14); const ss = sentences(text); const items = [];
  for (const kw of kws) {
    const s = ss.find(x => new RegExp('\\b' + kw + '\\b', 'i').test(x) && !items.some(i => i.src === x)); if (!s) continue;
    const others = kws.filter(k => k !== kw).sort(() => Math.random() - .5).slice(0, 3);
    const options = [kw, ...others].sort(() => Math.random() - .5);
    items.push({ src: s, q: 'Fill in the blank: ' + s.replace(new RegExp('\\b' + kw + '\\b', 'i'), '_____'), options, answer: options.indexOf(kw), why: `The original sentence: “${s}”`, picked: null });
    if (items.length === 5) break;
  }
  return { offline: true, items, err: n };
}
async function ask(qText) {
  const qv = (qText || '').trim(); if (!qv || ASSIST.busy) return;
  ASSIST.chat.push({ role: 'user', content: qv }); ASSIST.busy = true; ASSIST.qaNote = '';
  $('aiPanel').innerHTML = panelHTML(); bindAssistant();
  const f = await aiReady;
  const finish = (content, note) => { ASSIST.busy = false; ASSIST.ctl = null; if (content) ASSIST.chat.push({ role: 'assistant', content }); ASSIST.qaNote = note || ''; if (ST.view === 'assistant') { $('aiPanel').innerHTML = panelHTML(); bindAssistant(); const c = $('chat'); if (c) c.lastElementChild?.scrollIntoView({ block: 'nearest' }); } };
  const offlineAnswer = () => {
    const qt = new Set(tokenize(qv)); const ss = sentences(ASSIST.text || '');
    const best = ss.map(s => ({ s, v: tokenize(s).filter(t => qt.has(t)).length })).filter(x => x.v).sort((a, b) => b.v - a.v).slice(0, 2);
    return best.length ? `From your material:\n${best.map(b => '- ' + b.s).join('\n')}` : 'I could not find this in your material. Try different words, or connect the AI for a full answer.';
  };
  if (!AI.fn) return finish(offlineAnswer(), f ? '' : AI.note);
  ASSIST.ctl = new AbortController();
  const rules = `You are GyaanSetu's AI study assistant helping a student with their study material. Answer the student's questions using the material below. If the material does not cover a question, say so briefly, then give a short general answer starting with "Beyond your material:". Keep answers under 160 words, use simple language, and use markdown bullets or **bold** where it helps.

${ASSIST.image ? 'The study material is the attached image.' : materialPrompt()}`;
  const turns = ASSIST.chat.slice(-10);
  const opts = { signal: ASSIST.ctl.signal, cache: false, onText: ({ text }) => { const el = $('liveMsg'); if (el) el.innerHTML = md(text); } };
  if (ASSIST.image) opts.images = [ASSIST.image];
  try {
    const { text } = await AI.fn([{ role: 'user', content: rules }, ...turns], opts);
    award(1); save(); finish(text);
  } catch (e) {
    const r = aiErr(e);
    if (e && e.code === 'cancelled') return finish(e.text || '', 'Stopped.');
    if (r.off) return finish(offlineAnswer(), r.msg);
    finish(e && e.text ? e.text : '', r.msg);
  }
}

    </div>
    <div class="authform">
      ${S.user ? `<div class="authcard card pad"><h2>Signed in as ${esc(S.user.name)}</h2><p class="muted">${esc(S.user.email || '')}</p><div class="rowbetween"><button class="btn primary" data-go="dashboard">Go to dashboard</button><button class="btn" id="logout">Sign out</button></div></div>` : `
      <form class="authcard" id="authForm" novalidate>
        <div class="authtabs" role="tablist"><button type="button" role="tab" data-auth="login" class="${!signup ? 'on' : ''}" aria-selected="${!signup}">Login</button><button type="button" role="tab" data-auth="signup" class="${signup ? 'on' : ''}" aria-selected="${signup}">Sign Up</button></div>
        ${signup ? `<div class="fld"><label for="aName">Full name</label><input class="field" id="aName" autocomplete="name" placeholder="Enter your name"></div>` : ''}
        <div class="fld"><label for="aEmail">Email or phone</label><input class="field" id="aEmail" autocomplete="username" placeholder="Enter your email or phone"></div>
        <div class="fld"><label for="aPass">Password</label><input class="field" id="aPass" type="password" autocomplete="${signup ? 'new-password' : 'current-password'}" placeholder="Enter your password"></div>
        <div class="rowbetween"><label class="opt"><input type="checkbox" id="aRemember" checked>Remember me</label>${signup ? '' : '<button type="button" class="btn ghost sm" id="forgot">Forgot password?</button>'}</div>
        <p class="small" id="aErr" style="color:var(--bad)" role="alert"></p>
        <button class="btn primary" style="padding:12px">${signup ? 'Create account' : 'Login'}</button>
        <div class="or">OR</div>
        <button type="button" class="btn" data-guest>${ic('i-user')}Continue as guest</button>
        <p class="small muted" style="text-align:center">${signup ? 'Already have an account?' : "Don't have an account?"} <button type="button" class="btn ghost sm" data-auth="${signup ? 'login' : 'signup'}">${signup ? 'Login' : 'Sign up'}</button></p>
        <p class="notice">Demo sign-in for the prototype. Your password is never stored or sent anywhere; only your display name is saved in this browser.</p>
      </form>`}
    </div>
  </div>`;
  document.querySelectorAll('[data-auth]').forEach(b => b.onclick = () => { ST.authTab = b.dataset.auth; renderLogin(); });
  const lo = $('logout'); if (lo) lo.onclick = () => { S.user = null; commit('Signed out.'); };
  const fp = $('forgot'); if (fp) fp.onclick = () => { $('aErr').textContent = 'Password reset is not part of this demo. Any password works.'; };
  const g = document.querySelector('[data-guest]'); if (g) g.onclick = () => { S.user = { name: 'Guest Learner', email: '' }; save(); toast('Welcome! You are browsing as a guest.'); go('dashboard'); };
  const form = $('authForm'); if (form) form.onsubmit = e => {
    e.preventDefault();
    const email = $('aEmail').value.trim(), pass = $('aPass').value, nameEl = $('aName');
    if (nameEl && nameEl.value.trim().length < 2) { $('aErr').textContent = 'Enter your name.'; nameEl.focus(); return; }
    if (!/^\S+@\S+\.\S+$/.test(email) && !/^\+?\d{8,15}$/.test(email.replace(/[\s-]/g, ''))) { $('aErr').textContent = 'Enter a valid email address or phone number.'; $('aEmail').focus(); return; }
    if (pass.length < 6) { $('aErr').textContent = 'Password must be at least 6 characters.'; $('aPass').focus(); return; }
    const guess = email.includes('@') ? email.split('@')[0].replace(/[._\d]+/g, ' ').trim() : 'Learner';
    const name = nameEl ? nameEl.value.trim() : guess.replace(/\b\w/g, c => c.toUpperCase()) || 'Learner';
    S.user = { name, email }; $('aPass').value = ''; save();
    toast(signup ? `Account created. Welcome, ${name.split(' ')[0]}!` : `Welcome back, ${name.split(' ')[0]}!`);
    go('dashboard');
  };
}

/* ================= Global events ================= */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-open],[data-q],[data-subject],[data-qtype],[data-save],[data-like],[data-complete],[data-askai],[data-back],[data-rvote],[data-action]');
  if (!t) return;
  const d = t.dataset;
  if (d.go) { if (d.go === 'community') ST.thread = null; go(d.go); if (d.anchor) setTimeout(() => { const el = $(d.anchor); if (el) el.scrollIntoView({ behavior: 'smooth' }); }, 30); return; }
  if (d.open) { go('detail', { id: d.open }); return; }
  if (d.q) { search(d.q); return; }
  if (d.subject) { F.types.clear(); F.subject = d.subject; ST.query = ''; ST.aiPath = null; go('results'); return; }
  if (d.qtype) { F.types = new Set([d.qtype]); F.subject = ''; const bq = $('bq'); search(bq ? bq.value : ''); return; }
  if (d.save) { const id = d.save; if (S.saved[id]) { delete S.saved[id]; commit('Removed from your library.'); } else { S.saved[id] = Date.now(); commit('Saved to your library.'); } return; }
  if (d.like) { const id = d.like; if (S.liked[id]) delete S.liked[id]; else S.liked[id] = true; commit(S.liked[id] ? 'Liked. Ranking updated.' : 'Like removed.'); return; }
  if (d.complete) { const id = d.complete; if (S.completed[id]) delete S.completed[id]; else { S.completed[id] = Date.now(); award(3); } commit(S.completed[id] ? 'Marked complete. +3 points' : 'Marked as not complete.'); return; }
  if (d.askai) { useResource(d.askai); ASSIST.tab = 'summary'; go('assistant'); return; }
  if (d.back) { go(ST.from || 'results'); return; }
  if (d.rvote) { S.rvotes[d.rvote] = !S.rvotes[d.rvote]; commit(); return; }
  if (d.action === 'resetF') { resetFilters(); return; }
});
$('hSearch').addEventListener('submit', e => { e.preventDefault(); search($('hq').value); $('hq').blur(); });
let hqT;
$('hq').addEventListener('input', () => { if (ST.view !== 'results') return; clearTimeout(hqT); hqT = setTimeout(() => { ST.query = $('hq').value.trim(); ST.aiPath = null; renderResults(); }, 180); });
matchMedia('(max-width: 760px)').addEventListener('change', renderUser);

const START = { home: 'home', search: 'results', explore: 'results', assistant: 'assistant', dashboard: 'dashboard', community: 'community', login: 'login' }[(location.hash || '').slice(1)] || 'home';
go(START);
</script>
